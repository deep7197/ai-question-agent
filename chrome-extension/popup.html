<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Question Agent</title>

    <style>
        body {
            width: 340px;
            margin: 0;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            color: #111827;
            box-sizing: border-box;
            background: #fff;
        }

        h2 {
            margin: 0 0 3px 0;
            font-size: 16px;
        }

        .subtitle {
            margin: 0 0 18px 0;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        #state {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            border-radius: 8px;
            background: #f3f4f6;
            margin-bottom: 6px;
        }

        #dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #9ca3af;
            flex: none;
        }

        #state.on {
            background: #dcfce7;
        }

        #state.on #dot {
            background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
        }

        #state.off {
            background: #fef2f2;
        }

        #state.off #dot {
            background: #b91c1c;
        }

        #stateText {
            font-weight: 600;
            font-size: 13.5px;
        }

        #detail {
            color: #6b7280;
            font-size: 11.5px;
            line-height: 1.55;
            margin: 0 0 16px 2px;
        }

        .label {
            font-weight: 600;
            font-size: 12px;
            color: #111827;
            margin: 0 0 8px 0;
        }

        .sites {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sites button {
            padding: 9px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
        }

        .sites button:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

    </style>
</head>

<body>

    <h2>AI Question Agent</h2>

    <p class="subtitle">
        This extension only lends the agent your browser. The work -
        your document, the questions, the answers - happens in the
        AI Question Agent app.
    </p>

    <div id="state">
        <span id="dot"></span>
        <span id="stateText">Checking...</span>
    </div>

    <p id="detail"></p>

    <p class="label">Sign in once, here</p>

    <div class="sites">
        <button data-url="https://chatgpt.com/">ChatGPT</button>
        <button data-url="https://claude.ai/new">Claude</button>
        <button data-url="https://gemini.google.com/app">Gemini</button>
    </div>

    <script src="popup.js"></script>

</body>
</html>
